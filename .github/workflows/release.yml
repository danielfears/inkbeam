name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate package
        shell: powershell
        run: |
          .\install.ps1 -ValidateOnly
          .\tests\WhiteboardReceiver.Tests.ps1
          .\tests\ReceiverHost.Tests.ps1
          dotnet run --project .\desktop\tests\InkBeam.SmokeTests -c Release

      - name: Install installer compiler
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build release packages
        shell: powershell
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "VERSION $version does not match tag ${{ github.ref_name }}."
          }
          .\scripts\Build-Release.ps1 -OutputDirectory $PWD

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          gh release create "${{ github.ref_name }}" `
            "InkBeam-Setup-v$version.exe" `
            "InkBeam-Setup-v$version.exe.sha256" `
            "InkBeam-v$version-win-x64.zip" `
            "InkBeam-v$version-win-x64.zip.sha256" `
            "InkBeam-v$version-win-arm64.zip" `
            "InkBeam-v$version-win-arm64.zip.sha256" `
            --title "InkBeam v$version" `
            --generate-notes
