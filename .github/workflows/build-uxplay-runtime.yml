name: Build patched UxPlay runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out InkBeam
        uses: actions/checkout@v5

      - name: Check out pinned UxPlay for Windows
        uses: actions/checkout@v5
        with:
          repository: leapbtw/uxplay-windows
          ref: 2.0.0.1736
          path: upstream/uxplay-windows
          fetch-depth: 1
          submodules: recursive

      - name: Verify and apply the authentication patch
        shell: powershell
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'upstream\uxplay-windows'
          $sourceRoot = Join-Path $runtimeRoot 'libuxplay'
          $expectedCommit = '437f37514257d9cb513ac7fbdee743b4da85852e'
          $actualCommit = (& git -C $sourceRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $expectedCommit) {
            throw "Unexpected libuxplay revision: $actualCommit"
          }

          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches\uxplay-random-password-attempt-count.patch'
          & git -C $sourceRoot apply --check $patch
          if ($LASTEXITCODE -ne 0) {
            throw 'The PIN authentication patch does not apply to the pinned source.'
          }
          & git -C $sourceRoot apply $patch
          if ($LASTEXITCODE -ne 0) {
            throw 'Applying the PIN authentication patch failed.'
          }
          & git -C $sourceRoot diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'The patched UxPlay source has whitespace errors.'
          }

          $handler = Join-Path $sourceRoot 'lib\raop_handlers.h'
          .\tests\UxPlayAuthenticationPolicy.Tests.ps1 -SourcePath $handler

      - name: Add headless entry point for authentication test
        shell: powershell
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'upstream\uxplay-windows'
          $probeSource = Join-Path $runtimeRoot 'src\inkbeam_auth_probe.cpp'
          Copy-Item `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tests\uxplay_auth_probe.cpp') `
            -Destination $probeSource

          $cmakePath = Join-Path $runtimeRoot 'CMakeLists.txt'
          $cmake = [IO.File]::ReadAllText($cmakePath)
          if ($cmake.Contains('inkbeam-uxplay-auth-probe')) {
            throw 'The headless authentication test target already exists.'
          }
          $cmake += @"

          add_executable(inkbeam-uxplay-auth-probe src/inkbeam_auth_probe.cpp)
          target_link_libraries(inkbeam-uxplay-auth-probe PRIVATE uxplay)
          target_include_directories(inkbeam-uxplay-auth-probe PRIVATE `${CMAKE_SOURCE_DIR}/libuxplay)
          "@
          [IO.File]::WriteAllText(
            $cmakePath,
            $cmake,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Cache Bonjour SDK
        uses: actions/cache@v5
        id: mdns-cache
        with:
          path: upstream/uxplay-windows/Bonjour SDK
          key: mdns-${{ runner.os }}-${{ hashFiles('upstream/uxplay-windows/mdnsresponder-patches/2881.patch') }}-v3
          restore-keys: |
            mdns-${{ runner.os }}-

      - name: Build Bonjour SDK
        if: steps.mdns-cache.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: upstream/uxplay-windows
        run: |
          git clone --branch rel/mDNSResponder-2881 --depth 1 `
            --single-branch `
            https://github.com/apple-oss-distributions/mDNSResponder.git `
            mdns2881

          cd mdns2881
          Copy-Item ..\mdnsresponder-patches\2881.patch .
          git apply -v 2881.patch
          if ($LASTEXITCODE -ne 0) { throw 'Applying the Bonjour Windows patch failed.' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Visual Studio discovery tool was not found: $vswhere"
          }
          $visualStudioPath = (& $vswhere -latest -products '*' `
            -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($visualStudioPath)) {
            throw 'Could not locate a Visual Studio installation with MSBuild.'
          }
          $msbuild = Join-Path $visualStudioPath 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild -PathType Leaf)) {
            throw "MSBuild was not found in the Visual Studio installation: $msbuild"
          }

          & $msbuild `
            .\mDNSWindows\DLL\dnssd.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Building dnssd.dll failed.' }

          & $msbuild `
            .\mDNSWindows\SystemService\mDNSResponder.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Building mDNSResponder.exe failed.' }

          New-Item -ItemType Directory -Force -Path '..\Bonjour SDK\Include' | Out-Null
          New-Item -ItemType Directory -Force -Path '..\Bonjour SDK\Lib\x64' | Out-Null
          New-Item -ItemType Directory -Force -Path '..\Bonjour SDK\Bin\x64' | Out-Null

          Copy-Item mDNSWindows\DLL\x64\Release\dnssd.dll '..\Bonjour SDK\Bin\x64\dnssd.dll'
          Copy-Item mDNSWindows\SystemService\x64\Release\mDNSResponder.exe '..\Bonjour SDK\Bin\x64\mDNSResponder.exe'
          Copy-Item mDNSShared\dns_sd.h '..\Bonjour SDK\Include\dns_sd.h'
          Copy-Item mDNSWindows\DLL\x64\Release\dnssd.lib '..\Bonjour SDK\Lib\x64\dnssd.lib'

          cd ..
          Remove-Item -LiteralPath mdns2881 -Recurse -Force

      - name: Cache MSYS2 packages
        uses: actions/cache@v5
        with:
          path: |
            C:\msys64\var\cache\pacman\pkg
            C:\msys64\var\lib\pacman\sync
          key: msys2-pacman-${{ runner.os }}-${{ hashFiles('upstream/uxplay-windows/ucrt_deps.txt') }}-v2
          restore-keys: |
            msys2-pacman-${{ runner.os }}-

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false

      - name: Use the canonical MSYS2 package mirror
        shell: msys2 {0}
        run: |
          printf 'Server = https://repo.msys2.org/mingw/$repo/\n' > /etc/pacman.d/mirrorlist.mingw
          printf 'Server = https://repo.msys2.org/msys/$arch/\n' > /etc/pacman.d/mirrorlist.msys

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/upstream/uxplay-windows/pip-cache
            C:\msys64\ucrt64\lib\python*\site-packages\winrt*
          key: pip-winrt-${{ runner.os }}-v2
          restore-keys: |
            pip-winrt-${{ runner.os }}-

      - name: Install build dependencies
        shell: msys2 {0}
        working-directory: upstream/uxplay-windows
        run: |
          export PIP_CACHE_DIR="${PWD}/pip-cache"
          mkdir -p "$PIP_CACHE_DIR"
          packages=()
          while IFS= read -r package; do
            package="${package%$'\r'}"
            [[ -z "$package" || "$package" == \#* ]] && continue
            packages+=("$package")
          done < ucrt_deps.txt
          packages+=(mingw-w64-ucrt-x86_64-openssl)

          attempt=1
          while [ "$attempt" -le 3 ]; do
            if pacman -S --needed --noconfirm "${packages[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "MSYS2 package install attempt $attempt failed; retrying in 10 seconds."
            sleep 10
            attempt=$((attempt + 1))
          done

          if ! python -c "import winrt.windows.foundation" 2>/dev/null; then
            pip install \
              winrt-Windows.Foundation \
              winrt-Windows.Foundation.Collections \
              winrt-Windows.Devices.Bluetooth.Advertisement \
              winrt-Windows.Storage.Streams \
              --break-system-packages
          fi

      - name: Build UxPlay
        shell: msys2 {0}
        working-directory: upstream/uxplay-windows
        run: |
          where windeployqt
          windeployqt --version
          ./make_release_CI.sh

      - name: Bundle the libraries the runtime imports
        shell: powershell
        run: |
          . .\WhiteboardReceiver.ps1

          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'upstream\uxplay-windows\release'
          $libraryRoot = 'C:\msys64\ucrt64\bin'

          # Upstream copies a fixed library list that lags the MSYS2 packages and
          # silently skips entries that no longer exist, so the FFmpeg libraries the
          # libav plugin imports were missing. Follow the import tables instead.
          $resolved = $false
          foreach ($pass in 1..12) {
            $unresolved = @(Get-MissingRuntimeDependencies -Root $runtimeRoot)
            if ($unresolved.Count -eq 0) {
              $resolved = $true
              break
            }
            foreach ($library in $unresolved) {
              $owners = $library.RequiredBy -join ', '
              $source = Join-Path $libraryRoot $library.Module
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                throw "$($library.Module) is needed by $owners but is not in $libraryRoot."
              }
              Copy-Item -LiteralPath $source -Destination $runtimeRoot
              Write-Output "Added $($library.Module), needed by $owners."
            }
          }
          if (-not $resolved) {
            throw 'The runtime libraries did not settle after 12 passes.'
          }
          Assert-RuntimeBundle -Root $runtimeRoot

      - name: Start Bonjour for authentication probe
        id: test-bonjour
        shell: powershell
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'upstream\uxplay-windows\release'
          $service = Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue
          $created = $null -eq $service
          if ($created) {
            & (Join-Path $runtimeRoot 'mDNSResponder.exe') -install
            if ($LASTEXITCODE -ne 0) {
              throw 'Installing the temporary Bonjour service failed.'
            }
            $service = Get-Service -Name 'Bonjour Service'
          }

          if ($service.Status -ne 'Running') {
            Start-Service -Name 'Bonjour Service'
            $service = Get-Service -Name 'Bonjour Service'
            $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          }

          $createdValue = $created.ToString().ToLowerInvariant()
          [IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "created=$createdValue`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Test first PIN after repeated challenges
        shell: msys2 {0}
        working-directory: upstream/uxplay-windows/release
        run: |
          cp ../build/inkbeam-uxplay-auth-probe.exe .
          trap 'rm -f ./inkbeam-uxplay-auth-probe.exe' EXIT
          python ../../../tests/uxplay_first_pin_integration.py ./inkbeam-uxplay-auth-probe.exe

      - name: Package and verify runtime
        shell: powershell
        run: |
          . .\WhiteboardReceiver.ps1

          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'upstream\uxplay-windows\release'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $archive = Join-Path $artifactRoot 'InkBeam-UxPlay-v2.0.0.1736-authfix2-x64.zip'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null

          Assert-RuntimeBundle -Root $runtimeRoot

          $unexpected = @(
            Get-ChildItem -LiteralPath $runtimeRoot -Recurse -File |
              Where-Object {
                $_.Extension -in @('.pem', '.register') -or
                $_.Name -like 'inkbeam-uxplay-auth-probe*'
              }
          )
          if ($unexpected.Count -gt 0) {
            throw "The runtime contains files that must not be distributed: $($unexpected.Name -join ', ')"
          }

          Compress-Archive -Path (Join-Path $runtimeRoot '*') `
            -DestinationPath $archive -CompressionLevel Optimal
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest *$(Split-Path -Leaf $archive)" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding Ascii
          "Runtime archive SHA-256: $digest" | Write-Output

      - name: Start the packaged receiver
        shell: powershell
        run: .\tests\ReceiverRuntime.Smoke.ps1 -Archive 'artifacts\InkBeam-UxPlay-v2.0.0.1736-authfix2-x64.zip'

      - name: Remove temporary Bonjour service
        if: always() && steps.test-bonjour.outputs.created == 'true'
        shell: powershell
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE 'upstream\uxplay-windows\release'
          $service = Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') {
              Stop-Service -Name 'Bonjour Service' -Force
              $service = Get-Service -Name 'Bonjour Service'
              $service.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
            }
            & (Join-Path $runtimeRoot 'mDNSResponder.exe') -remove
            if ($LASTEXITCODE -ne 0) {
              throw 'Removing the temporary Bonjour service failed.'
            }
          }

      - name: Upload patched runtime artifact
        uses: actions/upload-artifact@v5
        with:
          name: inkbeam-uxplay-runtime-2.0.0.1736-authfix2
          path: |
            artifacts/InkBeam-UxPlay-v2.0.0.1736-authfix2-x64.zip
            artifacts/InkBeam-UxPlay-v2.0.0.1736-authfix2-x64.zip.sha256
          if-no-files-found: error
